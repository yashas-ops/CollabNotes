<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CollabNotes</title>
    <script>
      (function() {
        try {
          var version = localStorage.getItem('theme-version');
          if (!version) {
            localStorage.setItem('theme', 'minimalist-gray');
            localStorage.setItem('theme-version', '1');
            document.documentElement.setAttribute('data-theme', 'minimalist-gray');
          } else {
            var saved = localStorage.getItem('theme');
            document.documentElement.setAttribute('data-theme', saved || 'minimalist-gray');
          }
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'minimalist-gray');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
